# Base images for the add-on (MEMP-196).
#
# Debian rather than the Home Assistant Alpine default, and not by preference: ONNX Runtime publishes no musl
# builds at all, so the embedding runtime cannot load on Alpine. Everything else in the server runs fine on
# musl — this is the one dependency that forces glibc, and vector recall is unusable on the box without it.
#
# Cost: a larger base image. The alternative was shipping an add-on that can never enable the feature it now
# contains, which is worse.
build_from:
  amd64: ghcr.io/home-assistant/amd64-base-debian:bookworm
  aarch64: ghcr.io/home-assistant/aarch64-base-debian:bookworm
